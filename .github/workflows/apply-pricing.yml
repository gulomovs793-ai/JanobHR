name: Apply pricing system
on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/apply-pricing.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply verified patch
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/pricing.patch
          git apply --check /tmp/pricing.patch
          git apply /tmp/pricing.patch
      - name: Verify
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Publish
        run: |
          rm .github/workflows/apply-pricing.yml
          git config user.name "Janob HR Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add subscription pricing and usage limits"
          git push origin HEAD:multi-tenant
