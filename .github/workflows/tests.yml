name: Apply premium Telegram UX

on:
  push:
    branches: [multi-tenant]

permissions:
  contents: write

jobs:
  apply-ux:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply premium UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index janobhr-premium-ux.patch
          git rm janobhr-premium-ux.patch
          git commit -m "Polish Telegram UX for candidates admins and founders"
          git push
