name: Market ready hardening

on:
  push:
    branches: [market-ready-hardening]
    paths:
      - .github/workflows/market-ready-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-ready-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply hardening patch
        run: python .github/scripts/market_ready_hardening.py
      - name: Auto-fix lint
        run: ruff check . --fix
      - name: Validate lint
        run: ruff check .
      - name: Validate syntax
        run: python -m compileall -q .
      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Harden Janob HR for market release"
            git push origin market-ready-hardening
          fi
