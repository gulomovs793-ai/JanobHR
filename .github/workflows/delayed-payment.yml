name: Accept delayed payment
on:
  push:
    branches: [multi-tenant]
    paths: [.github/workflows/delayed-payment.yml]
permissions: {contents: write}
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: multi-tenant}
      - env: {PATCH_B64: }
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d >/tmp/f.patch
          git apply --check /tmp/f.patch
          git apply /tmp/f.patch
      - run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          python -m unittest discover -s tests -q
      - run: |
          rm .github/workflows/delayed-payment.yml
          git config user.name "Janob HR Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Accept delayed card payments safely"
          git push origin HEAD:multi-tenant
