name: Hotfix DeepSeek vacancy question generation

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/fix-ai-generation-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Fix DeepSeek V4 calls and resilient question JSON parsing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("services/ai_scoring.py")
          s = p.read_text(encoding="utf-8")

          # DeepSeek V4 enables thinking mode by default. For Janob HR's short,
          # structured JSON calls this can consume the max_tokens budget in
          # reasoning_content and leave message.content empty/truncated. Force
          # non-thinking mode so vacancy generation and scoring return the JSON
          # payload directly and quickly.
          anchor = '''                payload = {
                      "model": model,
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": user_prompt},
                      ],
                      "temperature": 0,
                      "max_tokens": token_budget,
                  }
                  async with session.post(
          '''
          replacement = '''                payload = {
                      "model": model,
                      "messages": [
                          {"role": "system", "content": system_prompt},
                          {"role": "user", "content": user_prompt},
                      ],
                      "temperature": 0,
                      "max_tokens": token_budget,
                  }
                  # DeepSeek V4 defaults to thinking=enabled. In this bot we need
                  # deterministic structured output, not a long hidden reasoning pass.
                  # Disabling thinking prevents the token budget from being consumed
                  # before message.content is produced.
                  if "deepseek" in base.lower() or str(model).lower().startswith("deepseek"):
                      payload["thinking"] = {"type": "disabled"}
                      payload["stream"] = False

                  async with session.post(
          '''
          if anchor in s:
              s = s.replace(anchor, replacement, 1)
          elif 'payload["thinking"] = {"type": "disabled"}' not in s:
              raise AssertionError("DeepSeek payload anchor not found")

          # Make question generation tolerant of harmless model formatting:
          # markdown fences, explanatory text around the array, or a
          # {"questions": [...]} wrapper. A valid generated list must not be
          # discarded just because the provider wrapped it slightly differently.
          old_parse = '''    try:
                  content = re.sub(r"^```(?:json)?|```$", "", content, flags=re.MULTILINE).strip()
                  parsed = json.loads(content)
                  if not isinstance(parsed, list):
                      raise TypeError("AI ro'yxat (list) qaytarishi kerak edi")
          '''
          new_parse = '''    try:
                  content = re.sub(r"^```(?:json)?|```$", "", content, flags=re.MULTILINE).strip()
                  try:
                      parsed = json.loads(content)
                  except json.JSONDecodeError:
                      # Some OpenAI-compatible models add one short sentence before
                      # or after the JSON despite the prompt. Recover the first full
                      # array instead of treating the whole AI call as failed.
                      start = content.find("[")
                      end = content.rfind("]")
                      if start < 0 or end <= start:
                          raise
                      parsed = json.loads(content[start : end + 1])

                  if isinstance(parsed, dict) and isinstance(parsed.get("questions"), list):
                      parsed = parsed["questions"]
                  if not isinstance(parsed, list):
                      raise TypeError("AI ro'yxat (list) qaytarishi kerak edi")
          '''
          if old_parse in s:
              s = s.replace(old_parse, new_parse, 1)
          elif 'isinstance(parsed, dict) and isinstance(parsed.get("questions"), list)' not in s:
              raise AssertionError("Question JSON parser anchor not found")

          p.write_text(s, encoding="utf-8")
          print("DeepSeek vacancy generation hotfix applied")
          PY

      - name: Verify patch
        run: |
          python -m py_compile services/ai_scoring.py admin_bot/handlers_vacancy_edit.py
          grep -q 'payload\["thinking"\] = {"type": "disabled"}' services/ai_scoring.py
          grep -q 'parsed.get("questions")' services/ai_scoring.py
          grep -q 'callback_data="vacgen:retry"' admin_bot/handlers_vacancy_edit.py

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai_scoring.py
          git commit -m "Fix DeepSeek AI vacancy question generation" || exit 0
          git push origin HEAD:multi-tenant
