name: Deliver missed confirmations
on:
  push:
    branches: [multi-tenant]
    paths: [.github/workflows/missed-confirmation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply patch
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d | gzip -d | git apply --binary
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m ruff check .
          python -m unittest discover -s tests
          rm .github/workflows/missed-confirmation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Deliver missed payment confirmations"
          git push origin HEAD:multi-tenant
