name: Apply JanobHR redesign

on:
  push:
    branches: [multi-tenant]

permissions:
  contents: write

jobs:
  apply-redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index janobhr-redesign.patch
          git rm janobhr-redesign.patch
          git commit -m "Redesign founder and candidate management flows"
          git push
