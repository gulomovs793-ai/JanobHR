name: Patch partner menu once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-partner-menu-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Remove reply-keyboard Boshqaruv paneli button only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('partner_bot.py')
          text = path.read_text(encoding='utf-8')
          target = '            [partner_panel_button()],\n'
          if target not in text:
              raise SystemExit('Target reply-keyboard button row not found; refusing unrelated changes')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Commit and push multi-tenant
        run: |
          git config user.name "chatgpt-automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner_bot.py
          git commit -m "fix: remove partner panel from reply menu [skip ci]"
          git push origin HEAD:multi-tenant
