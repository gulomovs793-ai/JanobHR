          new = '''    result = _candidate_summary(app)
    vacancy = await database.get_vacancy(tenant["id"], app["vacancy_key"])
    show_risks = await _feature_enabled_for_tenant(tenant["id"], FEATURE_RISK_SIGNALS)
    result.update(
