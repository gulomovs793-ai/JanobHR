name: Finalize partner public copy cleanup

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/finalize-partner-public-copy-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Remove residual company-internal wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("partner_bot.py")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ("Mahsulotni tushuntirish, mijoz savollariga javob berish va ishga tushirishda Janob HR jamoasi yordam beradi.", "Sizga tavsiya qilish uchun kerakli materiallar va tushuntirishlar beriladi."),
              ("Chegirma Janob HR hisobidan emas, sizning komissiyangizdan ayriladi.", "Chegirma sizning komissiyangizdan ayriladi."),
              ("boshqa partner kodi avtomatik qabul qilinmaydi", "boshqa hamkor kodi avtomatik qabul qilinmaydi"),
              ("Bu bo'lim faqat tasdiqlangan partnerlar uchun.", "Bu bo'lim faqat tasdiqlangan hamkorlar uchun."),
              ("Mahsulotni tushuntirish va keyingi ishni biz qilamiz.", "Mijoz tarif olsa, sizga komissiya yoziladi."),
              ("Janob HR'ni tavsiya qilasiz, qolgan tushuntirish va xizmatni biz qilamiz.", "Janob HR'ni tavsiya qilasiz, mijoz tarif olsa komissiya sizga yoziladi."),
              ("Mijoz sizning link yoki promo kodingiz orqali tarif olsa, siz komissiya olasiz. Mahsulotni tushuntirishni biz qilamiz.", "Mijoz sizning link yoki promo kodingiz orqali tarif olsa, siz komissiya olasiz."),
              ("Janob HR sizga shu aloqani pulga aylantirish imkonini beradi: siz tavsiya qilasiz, biz mijozga xodim saralash botini tushuntiramiz va ishga tushiramiz. Mijoz tarif olsa, sizga komissiya yoziladi.", "Janob HR sizga shu aloqani daromadga aylantirish imkonini beradi: siz tavsiya qilasiz, mijoz tarif olsa sizga komissiya yoziladi."),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify partner-facing wording
        shell: bash
        run: |
          python -m py_compile partner_bot.py services/partner_ai.py partner_payout_bot.py partner_miniapp_api.py
          node --check partner_miniapp/app.js
          ! grep -Fq "Bu link mijozni hamkorlar botiga" partner_bot.py
          ! grep -Fq "Render envda <code>JANOBHR_MAIN_BOT_USERNAME" partner_bot.py
          ! grep -Fq "Mahsulotni tushuntirish va keyingi ishni biz qilamiz" partner_bot.py
          ! grep -Fq "qolgan tushuntirish va xizmatni biz qilamiz" partner_bot.py
          ! grep -Fq "Mahsulotni tushuntirishni biz qilamiz" partner_bot.py
          ! grep -Fq "biz mijozga xodim saralash botini tushuntiramiz" partner_bot.py
          ! grep -Fq "Referral link mijozni hamkor botiga emas" services/partner_ai.py
          ! grep -Fq "Janob HR jamoasi qiladi" services/partner_ai.py
          ! grep -Fq "Founder Botga tafsilotlar bilan yuborildi" partner_payout_bot.py
          ! grep -Fq "Link asosiy Janob HR botiga" partner_miniapp/index.html
          ! grep -Fq "Founder Botdagi" partner_miniapp/index.html
          ! grep -Fq '"founder_notified": founder_notified' partner_miniapp_api.py

      - name: Remove temporary cleanup workflows and commit
        shell: bash
        run: |
          git rm -f .github/workflows/clean-partner-public-copy.yml || true
          git rm -f .github/workflows/clean-partner-public-copy-v2.yml || true
          git rm -f .github/workflows/finalize-partner-public-copy-cleanup.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner_bot.py services/partner_ai.py partner_payout_bot.py partner_miniapp/index.html partner_miniapp/app.js partner_miniapp_api.py
          git commit -m "Finalize clean partner-facing copy"
          git push origin HEAD:multi-tenant
