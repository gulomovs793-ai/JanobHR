name: Market release verify

on:
  push:
    branches: [market-release-verify-2026-09-03]
    paths:
      - .github/workflows/market-release-verify.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-release-verify-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply narrow lint fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("miniapp_api.py")
          text = path.read_text(encoding="utf-8")
          old = '''    cookie = request.cookies.get("jh_tg_init") or ""
              if cookie:
                  try:
                      return unquote(cookie).strip()
                  except Exception:
                      return ""
              return ""
          '''
          new = '''    cookie = request.cookies.get("jh_tg_init") or ""
              if cookie:
                  return unquote(cookie).strip()
              return ""
          '''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one cookie decode block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Diff safety check
        run: git diff --check
      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp_api.py
          git commit -m "Fix Admin Mini App cookie decode lint" || exit 0
          git push origin HEAD:market-release-verify-2026-09-03
