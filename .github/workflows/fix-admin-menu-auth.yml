name: Fix admin Mini App menu auth

on:
  push:
    branches:
      - multi-tenant
    paths:
      - .github/workflows/fix-admin-menu-auth.yml
      - .github/scripts/fix_admin_menu_auth.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply admin Mini App auth repair
        run: python .github/scripts/fix_admin_menu_auth.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/app.js miniapp/janobhr2.js miniapp/index.html miniapp_api.py webhook_app.py
          git commit -m "Fix Admin Mini App menu authentication" || exit 0
          git push origin HEAD:multi-tenant
