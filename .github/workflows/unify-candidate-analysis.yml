          s = replace_once(s, old_notify, new_notify, 'notification card context')
          s = replace_once(
              s,
              '''    if voice_answers:
        vacancy = await database.get_vacancy(tenant_id, app["vacancy_key"])
        if vacancy:''',
              '''    if voice_answers:
        if vacancy:''',
              'reuse vacancy for voice',
          )
          p.write_text(s, encoding='utf-8')

          # 3) Admin bot candidate screen uses same vacancy-aware card.
          p = Path('admin_bot/handlers_candidates.py')
          s = p.read_text(encoding='utf-8')
          old = '''    usage = await database.get_subscription_usage(tenant_id)
    text = format_candidate_card(
