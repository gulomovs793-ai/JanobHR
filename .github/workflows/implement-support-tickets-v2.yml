name: Implement support tickets v2

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/implement-support-tickets-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Apply support ticket patch
        shell: bash
        run: |
          PAYLOAD=''
          PAYLOAD+=''
          PAYLOAD+=''
          PAYLOAD+=''
          python -c "import base64; exec(base64.b64decode('$PAYLOAD').decode('utf-8'))"

      - name: Verify support flow
        shell: bash
        run: |
          python -m py_compile services/partner_database.py partner_bot.py founder_panel.py
          grep -Fq 'partner_support_tickets' services/partner_database.py
          grep -Fq 'receive_support_question' partner_bot.py
          grep -Fq 'Mijozlarning savollari' founder_panel.py
          grep -Fq 'send_support_reply' founder_panel.py

      - name: Commit implementation and cleanup workflows
        shell: bash
        run: |
          rm -f .github/workflows/implement-support-tickets.yml
          rm -f .github/workflows/implement-support-tickets-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add persistent founder support tickets"
          git push origin HEAD:multi-tenant
