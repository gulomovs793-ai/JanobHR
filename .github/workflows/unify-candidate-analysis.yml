              'miniapp analysis import',
          )
          s = s.replace('        "username": app.get("username"),\n', '')
          old = '''    result = _candidate_summary(app)
    vacancy = await database.get_vacancy(tenant["id"], app["vacancy_key"])
    result.update(
        {
