name: Unify candidate analysis

on:
  push:
    branches:
      - multi-tenant
    paths:
      - .github/workflows/unify-candidate-analysis.yml
      - .github/scripts/unify_candidate_analysis.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: multi-tenant
          fetch-depth: 50

      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/unify_candidate_analysis.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('verdict = "yashil""""', 'verdict = "yashil"""')
          p.write_text(s, encoding='utf-8')
          PY
          python .github/scripts/unify_candidate_analysis.py

      - name: Verify
        run: |
          python -m py_compile services/ai_scoring.py handlers/admin.py admin_bot/handlers_candidates.py miniapp_api.py
          grep -Fq 'avg_amaliylik' services/ai_scoring.py
          grep -Fq "if avg_score < 50:" services/ai_scoring.py
          grep -Fq '🛠 Amaliylik' handlers/admin.py
          grep -Fq 'build_candidate_analysis' handlers/admin.py
          grep -Fq '"analysis": build_candidate_analysis' miniapp_api.py
          grep -Fq 'Janob HR tahlili' miniapp/janobhr2.js
          grep -Fq '❓ <b>' handlers/admin.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai_scoring.py handlers/admin.py admin_bot/handlers_candidates.py miniapp_api.py miniapp/janobhr2.js
          git commit -m "Unify tenant candidate analysis" || exit 0
          git push origin HEAD:multi-tenant
