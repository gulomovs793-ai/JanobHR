name: Add main candidate demo flow

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/add-main-candidate-demo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Patch main candidate demo
        shell: bash
        run: |
          python -c "import base64; exec(base64.b64decode(''))"
      - name: Verify syntax and isolation
        run: |
          python -m py_compile handlers/start.py handlers/questions.py
          grep -Fq 'callback_data="demo:start"' handlers/start.py
          grep -Fq 'demo_mode=True' handlers/start.py
          grep -Fq 'Admin botda siz taxminan shunday' handlers/questions.py
          grep -Fq 'if BOT_TOKEN and message.bot.token == BOT_TOKEN:' handlers/questions.py
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handlers/start.py handlers/questions.py
          git commit -m "Add demo experience to main candidate bot" || exit 0
          git push origin HEAD:multi-tenant
