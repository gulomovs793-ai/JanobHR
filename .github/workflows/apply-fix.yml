name: Apply JanobHR fix
on:
  push:
    paths:
      - .github/workflows/apply-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply tested fix
        shell: bash
        run: |
          echo '' | base64 -d | xz -d > /tmp/janobhr.patch
          git apply --index /tmp/janobhr.patch
          git rm .github/workflows/apply-fix.yml
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'Restore business onboarding and fix admin formatting'
          git push origin multi-tenant
