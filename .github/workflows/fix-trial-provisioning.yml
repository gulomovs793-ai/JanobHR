name: Fix trial provisioning

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/fix-trial-provisioning.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply provisioning fix
        run: python .github/scripts/fix_trial_provisioning.py
      - name: Validate lint
        run: |
          pip install -r requirements-dev.txt
          ruff check .
      - name: Validate syntax
        run: python -m compileall -q .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Activate trial bots immediately after setup"
            git push origin multi-tenant
          fi
