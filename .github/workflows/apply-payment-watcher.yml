name: Apply payment watcher fix
on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/apply-payment-watcher.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply fix
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
      - name: Verify
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Publish
        run: |
          rm .github/workflows/apply-payment-watcher.yml
          git config user.name "Janob HR Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Run payment watcher with polling bot"
          git push origin HEAD:multi-tenant
