name: Janob HR 2 features

on:
  push:
    branches: [janobhr-2-features]
    paths:
      - .github/workflows/janobhr2-features.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janobhr-2-features
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply Janob HR 2 feature patch
        run: python .github/scripts/apply_janobhr2_features.py
      - name: Auto-fix lint
        run: ruff check . --fix
      - name: Validate lint
        run: ruff check .
      - name: Validate syntax
        run: python -m compileall -q .
      - name: Run full tests
        run: python -m unittest discover -s tests -v
      - name: Commit validated feature code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build Janob HR 2 hiring intelligence"
            git push origin janobhr-2-features
          fi
