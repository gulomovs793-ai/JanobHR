name: Release hardening

on:
  push:
    branches: [release-hardening-2026-09-03]
    paths:
      - .github/scripts/release_hardening.py
      - .github/scripts/release_hardening_fix.py
      - .github/workflows/release-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-hardening-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply hardening patch
        run: |
          python .github/scripts/release_hardening.py
          python .github/scripts/release_hardening_fix.py
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Diff safety check
        run: git diff --check
      - name: Commit tested hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "Harden market release blockers"
          git push origin HEAD:release-hardening-2026-09-03
