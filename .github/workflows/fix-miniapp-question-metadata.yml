name: Fix Mini App question metadata

on:
  push:
    branches:
      - multi-tenant
    paths:
      - .github/workflows/fix-miniapp-question-metadata.yml
      - .github/scripts/fix_miniapp_question_metadata.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: multi-tenant
          fetch-depth: 50

      - name: Apply patch
        run: python .github/scripts/fix_miniapp_question_metadata.py

      - name: Verify
        run: |
          python -m py_compile miniapp_api.py
          grep -Fq 'def _infer_question_metadata' miniapp_api.py
          grep -Fq '"hard_filter": hard_filter' miniapp_api.py
          grep -Fq '"ai_score": ai_score' miniapp_api.py
          grep -Fq 'previous_questions=existing_vacancy.get("questions")' miniapp_api.py

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp_api.py
          git commit -m "Preserve tenant question scoring metadata" || exit 0
          git push origin HEAD:multi-tenant
