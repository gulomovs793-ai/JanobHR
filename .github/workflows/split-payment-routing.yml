name: Split payment routing

on:
  push:
    branches:
      - multi-tenant
    paths:
      - .github/workflows/split-payment-routing.yml
      - .github/scripts/split_payment_routing.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply split
        run: python .github/scripts/split_payment_routing.py
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/payment_automation.py config.py webhook_app.py
          git commit -m "Split Janob HR payment routing" || exit 0
          git push origin HEAD:multi-tenant
