name: Hotfix full AI question preview

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/fix-full-ai-question-preview.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Show AI questions without truncation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("admin_bot/handlers_vacancy_edit.py")
          s = p.read_text(encoding="utf-8")

          old = '        text = q["text"][:180] + ("…" if len(q["text"]) > 180 else "")\n'
          new = '        text = str(q["text"]).strip()\n'

          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise AssertionError("Question preview truncation anchor not found")

          p.write_text(s, encoding="utf-8")
          print("Full AI question preview hotfix applied")
          PY

      - name: Verify patch
        run: |
          python -m py_compile admin_bot/handlers_vacancy_edit.py
          python - <<'PY'
          from admin_bot.handlers_vacancy_edit import format_questions_preview
          text = "A" * 260
          preview = format_questions_preview([{"text": text, "ai_score": True}])
          assert text in preview, preview
          assert "…" not in preview, preview
          print("Question preview is complete")
          PY

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin_bot/handlers_vacancy_edit.py
          git commit -m "Show full AI generated questions" || exit 0
          git push origin HEAD:multi-tenant
