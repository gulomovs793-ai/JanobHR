name: Apply and test business lead fix
on:
  push:
    paths:
      - .github/workflows/apply-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply fix
        run: |
          echo '' | base64 -d | xz -d > /tmp/fix.patch
          git apply --index /tmp/fix.patch
      - name: Test fix
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Push fix
        run: |
          git rm .github/workflows/apply-fix.yml
          git config user.name 'Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'Route business leads through Janob HR Admin'
          git push origin multi-tenant
