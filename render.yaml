services:
  - type: web
    name: janob-hr
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    branch: multi-tenant
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python webhook_app.py
    healthCheckPath: /health
    numInstances: 1
    disk:
      name: janob-hr-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SQLITE_PATH
        value: /data/data.db
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: FOUNDER_BOT_TOKEN
        sync: false
      - key: FOUNDER_USER_ID
        sync: false
      - key: SETUP_BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE
        sync: false
      - key: AI_MODEL
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_USERBOT_SESSION
        sync: false
      - key: CARD_BOT_USERNAME
        sync: false
      - key: PAYMENT_CARD_NUMBER
        sync: false
      - key: PAYMENT_CARD_HOLDER
        sync: false
