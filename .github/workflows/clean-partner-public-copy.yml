name: Clean partner public copy

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/clean-partner-public-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Remove internal architecture from partner-facing copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=None):
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              if old not in s:
                  raise AssertionError(f"Expected text not found in {path}: {old[:100]!r}")
              s = s.replace(old, new, count if count is not None else -1)
              p.write_text(s, encoding="utf-8")

          # Partner bot: show benefits/actions, never internal bot routing or infra.
          p = Path("partner_bot.py")
          s = p.read_text(encoding="utf-8")
          replacements = [
              (
                  "Zarur bo'lsa Founder jamoasi to'lovni qo'lda ko'rib chiqadi.",
                  "Zarur bo'lsa holat qo'lda ko'rib chiqiladi.",
              ),
              (
                  "Tasdiqlangan partner Boshqaruv panelida",
                  "Tasdiqlangan hamkor Boshqaruv panelida",
              ),
              (
                  "boshqa partner promo kodini",
                  "boshqa hamkor promo kodini",
              ),
              (
                  "ikki partnerga bo'linmaydi",
                  "ikki hamkorga bo'linmaydi",
              ),
              (
                  "Har bir partnerda bitta faol promo kod bo'ladi.",
                  "Har bir hamkorda bitta faol promo kod bo'ladi.",
              ),
              (
                  "1️⃣ asosiy botga olib kiradigan referral link",
                  "1️⃣ shaxsiy referral link",
              ),
              (
                  "Profilingiz faol. Ko'k <b>«Boshqaruv paneli»</b> tugmasini bosing — referral, leadlar, promo, komissiya va pul yechish bitta Mini App ichida.",
                  "Profilingiz faol. Ko'k <b>«Boshqaruv paneli»</b> tugmasini bosing — referral, leadlar, promo, komissiya va pul yechish bo'limlari bir joyda.",
              ),
              (
                  "⏳ Arizangiz ko'rib chiqilmoqda. Tasdiqlangach bot sizga referral link, promo kod va FAQ bo'limini beradi.",
                  "⏳ Arizangiz ko'rib chiqilmoqda. Tasdiqlangach referral link, promo kod va FAQ bo'limi ochiladi.",
              ),
              (
                  "Avval sizni tushunib olamiz. Keyin bot sizga oddiy tilda: sizga bu nima uchun kerak, Janob HR qanday yordam beradi, qayerdan pul chiqishi mumkin — shuni aytadi.",
                  "Avval sizni tushunib olamiz. Keyin sizga oddiy tilda: bu nima uchun kerak, Janob HR qanday yordam beradi va qanday daromad qilish mumkinligini ko'rsatamiz.",
              ),
              (
                  "Ko'k <b>«Boshqaruv paneli»</b> tugmasi yoqildi. Unda referral link, leadlar, promo kod, komissiya, pul yechish va FAQ bir joyda ishlaydi.",
                  "Ko'k <b>«Boshqaruv paneli»</b> tugmasi yoqildi. Referral link, leadlar, promo kod, komissiya, pul yechish va FAQ bo'limlari bir joyda ishlaydi.",
              ),
              (
                  "Bu bo'lim faqat tasdiqlangan partnerlar uchun. /start yuboring.",
                  "Bu bo'lim faqat tasdiqlangan hamkorlar uchun. /start yuboring.",
              ),
              (
                  "⚠️ Mini App manzili sozlanmagan. Admin WEBHOOK_BASE_URL ni tekshirishi kerak.",
                  "⚠️ Boshqaruv panelini hozir ochib bo'lmadi. Birozdan keyin qayta urinib ko'ring.",
              ),
              (
                  "📊 <b>Partner statistikasi</b>",
                  "📊 <b>Hamkor statistikasi</b>",
              ),
              (
                  "Promo orderlar:",
                  "Promo buyurtmalar:",
              ),
              (
                  "\nChegirma sizning komissiyangizdan ayrildi. Kompaniya zarar qilmaydi.",
                  "\nChegirma sizning komissiyangizdan ayrildi.",
              ),
              (
                  "🆘 Savol bo'lsa shu chatga yozing. Founder jamoasi partner profilingiz orqali siz bilan bog'lanadi.",
                  "🆘 Savol bo'lsa shu chatga yozing. Kerak bo'lsa siz bilan bog'lanamiz.",
              ),
          ]
          for old, new in replacements:
              if old not in s:
                  raise AssertionError(f"partner_bot.py text not found: {old!r}")
              s = s.replace(old, new)

          old = '''        await message.answer(\n            "Bu eski link edi.\\n\\n"\n            "Mijoz endi hamkorlar botida qolmaydi. Pastdagi tugma uni to'g'ridan-to'g'ri asosiy Janob HR botga olib kiradi:",\n            reply_markup=kb,\n        )'''
          new = '''        await message.answer(\n            "Davom etish uchun pastdagi tugmani bosing.",\n            reply_markup=kb,\n        )'''
          if old not in s:
              raise AssertionError("legacy referral public routing copy not found")
          s = s.replace(old, new, 1)

          s = s.replace(
              'InlineKeyboardButton(text="👔 Asosiy Janob HR botga o\'tish", url=target_url)',
              'InlineKeyboardButton(text="👔 Davom etish", url=target_url)',
          )
          s = s.replace(
              '"Referral qabul qilindi, lekin asosiy Janob HR bot topilmadi. JANOBHR_MAIN_BOT_USERNAME sozlanishi kerak."',
              '"⚠️ Referral linkni hozir ochib bo\'lmadi. Birozdan keyin qayta urinib ko\'ring."',
          )

          old = '''        await message.answer(\n            "⚠️ Asosiy Janob HR bot topilmadi.\\n\\n"\n            "Render envda <code>JANOBHR_MAIN_BOT_USERNAME=janobHR_bot</code> bo'lishi kerak."\n        )'''
          new = '''        await message.answer(\n            "⚠️ Referral linkni hozir yaratib bo'lmadi. Birozdan keyin qayta urinib ko'ring."\n        )'''
          if old not in s:
              raise AssertionError("referral infra error copy not found")
          s = s.replace(old, new, 1)

          old = '''    await message.answer(\n        "🔗 <b>Sizning referral linkingiz</b>\\n\\n"\n        f"<code>{link}</code>\\n\\n"\n        "Bu link mijozni hamkorlar botiga qaytarmaydi. U to'g'ridan-to'g'ri <b>asosiy Janob HR botga</b> kiradi.\\n"\n        "Mijoz shu link orqali botini ochsa, u sizga bog'lanadi."\n    )'''
          new = '''    await message.answer(\n        "🔗 <b>Sizning referral linkingiz</b>\\n\\n"\n        f"<code>{link}</code>\\n\\n"\n        "Mijozga shu linkni yuboring. Link orqali kelgan mijoz sizga avtomatik biriktiriladi."\n    )'''
          if old not in s:
              raise AssertionError("referral public copy block not found")
          s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")

          # Payout chat: never expose who receives the internal notification.
          p = Path("partner_payout_bot.py")
          s = p.read_text(encoding="utf-8")
          old = '''    notification_text = (\n        "Founder Botga tafsilotlar bilan yuborildi."\n        if founder_notified\n        else "⚠️ Founder Botga avtomatik notification yuborilmadi; admin sozlamani tekshiradi."\n    )\n    await message.answer(\n        f"✅ Pul yechish arizangiz yuborildi.\\n\\n"\n        f"Ariza: <b>#{result['id']}</b>\\n"\n        f"Asosiy summa: <b>{pdb.format_uzs(result['requested_amount'])}</b>\\n"\n        f"Kechikish bonusi hozircha: <b>{pdb.format_uzs(result['bonus_amount'])}</b>\\n"\n        f"Aniq o'tkazma: <b>{pdb.format_uzs(result['total_amount'])}</b>\\n"\n        f"To'lov kuni: <b>{result['payout_due_date']}</b>\\n\\n"\n        f"{notification_text} Sana o'tsa, kechikish bonusi real vaqtda qayta hisoblanadi."\n    )'''
          new = '''    await message.answer(\n        f"✅ Pul yechish arizangiz yuborildi.\\n\\n"\n        f"Ariza: <b>#{result['id']}</b>\\n"\n        f"Asosiy summa: <b>{pdb.format_uzs(result['requested_amount'])}</b>\\n"\n        f"Kechikish bonusi hozircha: <b>{pdb.format_uzs(result['bonus_amount'])}</b>\\n"\n        f"Aniq o'tkazma: <b>{pdb.format_uzs(result['total_amount'])}</b>\\n"\n        f"To'lov kuni: <b>{result['payout_due_date']}</b>\\n\\n"\n        "Sana o'tsa, kechikish bonusi real vaqtda qayta hisoblanadi."\n    )'''
          if old not in s:
              raise AssertionError("payout notification disclosure block not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          # Mini App visible copy.
          p = Path("partner_miniapp/index.html")
          s = p.read_text(encoding="utf-8")
          html_replacements = [
              ("PARTNER DASHBOARD", "HAMKOR PANELI"),
              ("Link asosiy Janob HR botiga olib kiradi va mijoz avtomatik sizga biriktiriladi.", "Link orqali kelgan mijoz avtomatik sizga biriktiriladi."),
              ("Mijoz asosiy Janob HR botiga kiradi.", "Mijoz link orqali ro‘yxatdan o‘tadi."),
              ("Har bir partnerda bitta faol promo kod bo‘ladi.", "Har bir hamkorda bitta faol promo kod bo‘ladi."),
              ("Karta raqami saqlanadi va Founder Botdagi faqat to‘lov mas’uliga ko‘rsatiladi. Mini Appga to‘liq karta raqami qaytarilmaydi.", "Karta raqamingiz xavfsiz saqlanadi va faqat to‘lovni amalga oshirish uchun ishlatiladi."),
              ("<details><summary>Referral link qayerga olib kiradi?</summary><p>Hamkor botiga emas, asosiy Janob HR botiga.</p></details>", "<details><summary>Referral link qanday ishlaydi?</summary><p>Link orqali kelgan mijoz sizga avtomatik biriktiriladi.</p></details>"),
              ("Boshqa partnerga bog‘langan mijozning kodi qabul qilinmaydi.", "Boshqa hamkorga biriktirilgan mijozning kodi qabul qilinmaydi."),
              ("Mini Appni Hamkor bot ichidan qayta oching.", "Panelni yopib, qayta oching."),
          ]
          for old, new in html_replacements:
              if old not in s:
                  raise AssertionError(f"index.html text not found: {old!r}")
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")

          # Mini App runtime errors: no implementation/transport details.
          p = Path("partner_miniapp/app.js")
          s = p.read_text(encoding="utf-8")
          js_replacements = [
              ("Mini Appni Hamkor bot ichidan qayta oching.", "Panelni yopib, qayta oching."),
              ("Telegram tasdiqlashi topilmadi. Panelni Hamkor bot ichidagi ko‘k tugmadan oching.", "Sessiya tasdiqlanmadi. Panelni yopib, qayta oching."),
              ("Telegram sessiyasi tasdiqlanmadi. Mini Appni bot ichidan qayta oching.", "Sessiya tasdiqlanmadi. Panelni yopib, qayta oching."),
              ("Server bilan aloqa bo‘lmadi. Qayta urinib ko‘ring.", "Ma’lumotlarni yuklab bo‘lmadi. Qayta urinib ko‘ring."),
              ("Telegram sessiyasi topilmadi.", "Sessiya tasdiqlanmadi. Panelni qayta oching."),
          ]
          for old, new in js_replacements:
              if old not in s:
                  raise AssertionError(f"app.js text not found: {old!r}")
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")

          # Browser API no longer receives internal notification routing status.
          p = Path("partner_miniapp_api.py")
          s = p.read_text(encoding="utf-8")
          old = '            "founder_notified": founder_notified,\n'
          if old not in s:
              raise AssertionError("founder_notified public API field not found")
          s = s.replace(old, "", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Verify public copy cleanup
        shell: bash
        run: |
          python -m py_compile partner_bot.py partner_payout_bot.py partner_miniapp_api.py
          node --check partner_miniapp/app.js
          ! grep -Fq "Bu link mijozni hamkorlar botiga" partner_bot.py
          ! grep -Fq "Render envda <code>JANOBHR_MAIN_BOT_USERNAME" partner_bot.py
          ! grep -Fq "Founder Botga tafsilotlar bilan yuborildi" partner_payout_bot.py
          ! grep -Fq "Link asosiy Janob HR botiga" partner_miniapp/index.html
          ! grep -Fq "Founder Botdagi" partner_miniapp/index.html
          ! grep -Fq '"founder_notified": founder_notified' partner_miniapp_api.py
          grep -Fq "Mijozga shu linkni yuboring. Link orqali kelgan mijoz sizga avtomatik biriktiriladi." partner_bot.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add partner_bot.py partner_payout_bot.py partner_miniapp/index.html partner_miniapp/app.js partner_miniapp_api.py
          git commit -m "Clean internal details from partner-facing copy" || exit 0
          git push origin HEAD:multi-tenant
