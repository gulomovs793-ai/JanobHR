name: Hotfix DeepSeek vacancy question generation

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/fix-ai-generation-timeout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Patch AI generation and full question display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep the DeepSeek structured-output production fix idempotent.
          p = Path("services/ai_scoring.py")
          s = p.read_text(encoding="utf-8")

          deepseek_marker = 'payload["thinking"] = {"type": "disabled"}'
          if deepseek_marker not in s:
              request_pos = s.index("            async def request_once(token_budget: int)")
              post_pos = s.index("                async with session.post(\n", request_pos)
              inject = '''                # DeepSeek V4 defaults to thinking mode. For structured HR JSON\n                # we need the final answer directly and quickly.\n                if "deepseek" in base.lower() or str(model).lower().startswith("deepseek"):\n                    payload["thinking"] = {"type": "disabled"}\n                    payload["stream"] = False\n\n'''
              s = s[:post_pos] + inject + s[post_pos:]

          wrapper_marker = 'isinstance(parsed, dict) and isinstance(parsed.get("questions"), list)'
          if wrapper_marker not in s:
              fn_pos = s.index("async def generate_questions(")
              parse_pos = s.index("        parsed = json.loads(content)\n", fn_pos)
              parse_end = parse_pos + len("        parsed = json.loads(content)\n")
              replacement = '''        try:\n            parsed = json.loads(content)\n        except json.JSONDecodeError:\n            start = content.find("[")\n            end = content.rfind("]")\n            if start < 0 or end <= start:\n                raise\n            parsed = json.loads(content[start : end + 1])\n\n        if isinstance(parsed, dict) and isinstance(parsed.get("questions"), list):\n            parsed = parsed["questions"]\n'''
              s = s[:parse_pos] + replacement + s[parse_end:]

          p.write_text(s, encoding="utf-8")

          # Never cut AI-generated question text in the admin preview.
          p = Path("admin_bot/handlers_vacancy_edit.py")
          s = p.read_text(encoding="utf-8")
          old = '        text = q["text"][:180] + ("…" if len(q["text"]) > 180 else "")\n'
          new = '        text = str(q["text"]).strip()\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise AssertionError("Question preview truncation anchor not found")
          p.write_text(s, encoding="utf-8")

          print("AI generation and full question display patch applied")
          PY

      - name: Verify patch
        run: |
          python -m py_compile services/ai_scoring.py admin_bot/handlers_vacancy_edit.py
          grep -Fq 'payload["thinking"] = {"type": "disabled"}' services/ai_scoring.py
          grep -Fq 'parsed.get("questions")' services/ai_scoring.py
          python - <<'PY'
          from pathlib import Path
          s = Path("admin_bot/handlers_vacancy_edit.py").read_text(encoding="utf-8")
          assert 'text = str(q["text"]).strip()' in s
          assert 'q["text"][:180]' not in s
          print("Full AI question preview verified")
          PY

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai_scoring.py admin_bot/handlers_vacancy_edit.py
          git commit -m "Show full AI generated questions" || exit 0
          git push origin HEAD:multi-tenant
