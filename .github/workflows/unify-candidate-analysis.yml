          new_identity = '''    lines = [
        f"🆕 <b>Yangi anketa</b> — {escape(str(app['vacancy_title']))}",
        f"👤 <b>{escape(str(app['full_name']))}</b>",
    ]'''
          s = replace_once(s, old_identity, new_identity, 'full-text identity')

          # Fetch vacancy before answers and show question + answer together.
          anchor = '''    for key, value in app["answers"].items():
        text = escape(str(value))'''
          replacement = '''    vacancy = await database.get_vacancy(tenant_id, app["vacancy_key"])
    question_texts = (
        {q["key"]: q["text"] for q in build_questions(vacancy, app.get("lang") or "uz")}
