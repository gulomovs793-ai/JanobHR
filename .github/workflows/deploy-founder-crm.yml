name: Deploy founder CRM
on:
  push:
    branches: [multi-tenant]
    paths: [.github/workflows/deploy-founder-crm.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant
      - name: Apply and test
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d | gzip -d | git apply --binary
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m ruff check .
          python -m unittest discover -s tests
          rm .github/workflows/deploy-founder-crm.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build founder CRM and proactive billing UX"
          git push origin HEAD:multi-tenant
