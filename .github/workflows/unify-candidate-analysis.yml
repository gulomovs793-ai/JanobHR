name: Unify candidate analysis

on:
  push:
    branches:
      - multi-tenant
    paths:
      - .github/workflows/unify-candidate-analysis.yml
      - .github/scripts/unify_candidate_analysis.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: multi-tenant
          fetch-depth: 50

      - name: Apply patch
        run: python .github/scripts/unify_candidate_analysis.py

      - name: Verify
        run: |
          python -m py_compile services/ai_scoring.py handlers/admin.py admin_bot/handlers_candidates.py miniapp_api.py
          python - <<'PY'
          from services.ai_scoring import aggregate_scores
          result = aggregate_scores({
              'weak': {'score': 40, 'verdict': 'qizil', 'natijadorlik': 35, 'masuliyat': 45, 'aniqlik': 40, 'red_flags': []},
              'strong': {'score': 80, 'verdict': 'yashil', 'natijadorlik': 85, 'amaliylik': 75, 'aniqlik': 80, 'red_flags': []},
          })
          assert result['avg_score'] == 60, result
          assert result['verdict'] == 'sariq', result
          assert result['avg_amaliylik'] == result['avg_masuliyat'], result
          PY
          grep -Fq '🛠 Amaliylik' handlers/admin.py
          grep -Fq '"analysis": build_candidate_analysis' miniapp_api.py
          grep -Fq 'Janob HR tahlili' miniapp/janobhr2.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ai_scoring.py handlers/admin.py admin_bot/handlers_candidates.py miniapp_api.py miniapp/janobhr2.js
          git commit -m "Unify tenant candidate analysis" || exit 0
          git push origin HEAD:multi-tenant
