name: Hotfix vacancy compare selector UX

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/fix-compare-vacancy-ux.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Make vacancy selection obvious before Top 3 comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('miniapp/janobhr2.js')
          s = js.read_text(encoding='utf-8')

          old_ui = '      tools.innerHTML = \'<select id="jh2-compare-vacancy" aria-label="Taqqoslash uchun vakansiya"><option value="">Vakansiyani tanlang</option></select><button id="jh2-compare-top" type="button">Top 3 ni taqqoslash</button>\';'
          new_ui = '      tools.innerHTML = \'<div class="jh2-compare-select-wrap"><span class="jh2-step-label">1-qadam · Vakansiyani tanlang</span><select id="jh2-compare-vacancy" aria-label="Taqqoslash uchun vakansiya"><option value="">Vakansiyani tanlang ↓</option></select><small>Qaysi lavozim nomzodlarini taqqoslamoqchisiz?</small></div><button id="jh2-compare-top" type="button">2-qadam · Top 3 ni taqqoslash</button>\';'
          if old_ui not in s:
              raise AssertionError('compare tools UI block not found')
          s = s.replace(old_ui, new_ui, 1)

          old_options = '      select.innerHTML = \'<option value="">Vakansiyani tanlang</option>\' + (data.items || []).filter(v=>v.active!==false).map(v=>`<option value="${esc(v.key)}">${esc(v.title)}</option>`).join(\'\');'
          new_options = '      select.innerHTML = \'<option value="">Vakansiyani tanlang ↓</option>\' + (data.items || []).filter(v=>v.active!==false).map(v=>`<option value="${esc(v.key)}">${esc(v.title)}</option>`).join(\'\');'
          if old_options not in s:
              raise AssertionError('vacancy options placeholder not found')
          s = s.replace(old_options, new_options, 1)

          old_compare = "    if (!key) { tg?.showAlert?.('Avval vakansiyani tanlang.'); return; }"
          new_compare = (
              "    if (!key) {\n"
              "      if (select) {\n"
              "        select.classList.add('jh2-needs-selection');\n"
              "        select.scrollIntoView({behavior:'smooth', block:'center'});\n"
              "        select.focus({preventScroll:true});\n"
              "        setTimeout(()=>select.classList.remove('jh2-needs-selection'), 2600);\n"
              "      }\n"
              "      tg?.HapticFeedback?.notificationOccurred?.('error');\n"
              "      tg?.showAlert?.('Yuqoridagi “1-qadam · Vakansiyani tanlang” maydonini bosing va vakansiyani tanlang. Keyin Top 3 ni taqqoslash tugmasini bosing.');\n"
              "      return;\n"
              "    }\n"
              "    select?.classList.remove('jh2-needs-selection');"
          )
          if old_compare not in s:
              raise AssertionError('compare empty-selection block not found')
          s = s.replace(old_compare, new_compare, 1)

          old_listener = "  document.addEventListener('submit', event => { if (event.target.id === 'jh2-onboarding-form') submitOnboarding(event); });"
          new_listener = (
              "  document.addEventListener('change', event => {\n"
              "    if (event.target.id === 'jh2-compare-vacancy') event.target.classList.remove('jh2-needs-selection');\n"
              "  });\n"
              "  document.addEventListener('submit', event => { if (event.target.id === 'jh2-onboarding-form') submitOnboarding(event); });"
          )
          if old_listener not in s:
              raise AssertionError('submit listener anchor not found')
          s = s.replace(old_listener, new_listener, 1)
          js.write_text(s, encoding='utf-8')

          css = Path('miniapp/janobhr2.css')
          c = css.read_text(encoding='utf-8')
          old_css = '.jh2-compare-tools{display:flex;gap:8px;margin:12px 0 16px}.jh2-compare-tools select{min-width:0;flex:1;border:1px solid #d2d2d7;border-radius:12px;background:#fff;padding:11px 12px;font:inherit}.jh2-compare-tools button{border:0;border-radius:12px;background:#111;color:#fff;font-weight:700;padding:0 14px}'
          new_css = '.jh2-compare-tools{display:flex;align-items:flex-end;gap:8px;margin:12px 0 16px}.jh2-compare-select-wrap{min-width:0;flex:1;display:grid;gap:5px}.jh2-step-label{font-size:12px;font-weight:800;color:#111}.jh2-compare-select-wrap small{font-size:11px;color:#8e8e93;line-height:1.3}.jh2-compare-tools select{width:100%;min-width:0;border:1px solid #d2d2d7;border-radius:12px;background:#fff;padding:11px 12px;font:inherit;transition:border-color .18s,box-shadow .18s}.jh2-compare-tools select.jh2-needs-selection{border-color:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.16)}.jh2-compare-tools button{border:0;border-radius:12px;background:#111;color:#fff;font-weight:700;padding:11px 14px;min-height:46px}'
          if old_css not in c:
              raise AssertionError('compare CSS block not found')
          c = c.replace(old_css, new_css, 1)
          css.write_text(c, encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -Fq '1-qadam · Vakansiyani tanlang' miniapp/janobhr2.js
          grep -Fq '2-qadam · Top 3 ni taqqoslash' miniapp/janobhr2.js
          grep -Fq 'jh2-needs-selection' miniapp/janobhr2.js
          grep -Fq 'jh2-compare-select-wrap' miniapp/janobhr2.css

      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/janobhr2.js miniapp/janobhr2.css
          git commit -m "Clarify vacancy selection for Top 3 comparison" || exit 0
          git push origin HEAD:multi-tenant
