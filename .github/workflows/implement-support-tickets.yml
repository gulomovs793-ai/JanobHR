name: Implement support tickets

on:
  push:
    branches: [multi-tenant]
    paths:
      - .github/workflows/implement-support-tickets.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: multi-tenant

      - name: Add persistent support ticket flow
        shell: bash
        run: |
